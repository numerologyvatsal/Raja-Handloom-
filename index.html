<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Raja Handloom</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Top bar: logo, shop name, Sync button and the tabs -->
  <header>
    <div style="display:flex;align-items:center;gap:10px">
      <img id="hl" alt="" style="height:36px;background:#fff;border-radius:6px;padding:2px">
      <input id="shop" aria-label="Shop name" style="min-width:0;flex:1">
      <button id="sy" class="btn" style="padding:6px 10px;font-size:12px;flex:0 0 auto" onclick="sync()">&#8635; Sync</button>
    </div>
    <nav id="nav"></nav>
  </header>

  <!-- The current screen is drawn here by the JavaScript -->
  <main id="app"></main>

  <!-- Pop-up windows are drawn here -->
  <div id="md"></div>

  <!-- Scripts (order matters) -->
  <script src="js/logo.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/bill.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/designs.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
